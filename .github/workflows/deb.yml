name: deb

on:
  push:            # любая ветка и теги v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# GH Actions на Linux и так запускает шаги в bash; в act по умолчанию sh,
# а в шагах используется pipefail — поэтому оболочка задаётся явно.
defaults:
  run:
    shell: bash

jobs:
  deb:
    name: build .deb
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      # git ставится ДО checkout: иначе actions/checkout не находит git и качает
      # архив через REST API — без .git, то есть без коммита и тегов для версии пакета.
      - name: Install git
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # вся история: нужна для git describe
          fetch-tags: true   # и теги — из них складывается версия пакета

      - name: Build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3 python3-pil

      - name: Check git metadata
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version
          sha="$(git rev-parse --short HEAD)"   # без .git здесь будет ошибка — и это сигнал
          echo "HEAD:     $sha"
          echo "describe: $(git describe --tags --always 2>&1 || true)"
          echo "tags:     $(git tag --list | tr '\n' ' ')"

      - name: Headless GTK tests
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-glib-2.0 python3-numpy xvfb
          xvfb-run -a python3 tests/smoke_gtk.py

      - name: Build packages
        id: build
        run: |
          set -euo pipefail
          ./packaging/build-deb.sh | tee build.log
          mapfile -t debs < <(ls dist/*.deb)
          test "${#debs[@]}" -eq 4
          version="$(dpkg-deb -f "${debs[0]}" Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### собрано 4 пакета, версия \`$version\`"
            echo
            for deb in "${debs[@]}"; do
              echo "- \`$(basename "$deb")\` ($(du -h "$deb" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb" | sed -n '1,12p' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Inspect package contents
        run: |
          set -euo pipefail
          check() {   # пакет, затем список обязательных путей построчно
            local deb="$1"; shift
            local listing; listing="$(mktemp)"
            dpkg-deb --contents "$deb" > "$listing"
            echo "── $(basename "$deb")"
            sed 's/^/  /' "$listing"
            local missing=0
            # Сравнение по последнему полю строки листинга: путь не должен быть
            # подстрокой другого (…silero-tts и …silero-tts.desktop).
            # Пайплайн с «grep -q» здесь не годится: он закрывает поток раньше,
            # dpkg-deb получает SIGPIPE, и с pipefail шаг ложно падает.
            for path in "$@"; do
              if awk -v p="$path" '$NF == p { found = 1 } END { exit(found ? 0 : 1) }' "$listing"; then
                echo "  ✓ $path"
              else
                echo "  ✗ нет в пакете: $path"
                missing=$((missing + 1))
              fi
            done
            # байткод и кеши в пакет попадать не должны
            if grep -qE '__pycache__|\.pyc' "$listing"; then
              echo "  ✗ в пакете есть __pycache__/.pyc"
              missing=$((missing + 1))
            fi
            rm -f "$listing"
            test "$missing" -eq 0
          }

          check dist/silero-tts-common_*.deb \
            ./usr/lib/silero-tts/silero_tts_reader/__init__.py \
            ./usr/lib/silero-tts/silero_tts_reader/config/config_manager.py \
            ./usr/lib/silero-tts/silero_tts_reader/core/tts_engine.py \
            ./usr/share/doc/silero-tts-common/copyright
          check dist/silero-tts-reader_*.deb \
            ./usr/bin/silero-tts-reader \
            ./usr/share/applications/silero-tts-reader.desktop \
            ./usr/share/icons/hicolor/256x256/apps/silero-tts-reader.png \
            ./usr/share/pixmaps/silero-tts-reader.png \
            ./usr/lib/silero-tts/run.py \
            ./usr/lib/silero-tts/silero_tts_reader/app.py \
            ./usr/lib/silero-tts/silero_tts_reader/ui/playback_widget.py \
            ./usr/lib/systemd/user/silero-tts-reader.service
          check dist/silero-tts-speechd_*.deb \
            ./usr/bin/silero-tts-speak \
            ./usr/bin/silero-tts-speechd \
            ./usr/lib/silero-tts/silero_tts_reader/cli.py
          check dist/speech-dispatcher-silero-tts_*.deb \
            ./etc/speech-dispatcher/modules/silero-tts.conf \
            ./usr/share/doc/speech-dispatcher-silero-tts/copyright
          # общий код не должен повторяться в двух пакетах
          if for deb in dist/*.deb; do dpkg-deb --contents "$deb" | awk '$NF ~ /^\.\// {print $NF}'; done \
              | grep -v '/$' | sort | uniq -d | tee /dev/stderr | grep -q .; then
            echo "✗ файл попал в два пакета"; exit 1
          fi
          echo "  ✓ файлы пакетов не пересекаются"

      - name: Install into a clean system
        run: |
          set -euo pipefail
          common_deb="$(ls dist/silero-tts-common_*.deb)"
          reader_deb="$(ls dist/silero-tts-reader_*.deb)"
          speaker_deb="$(ls dist/silero-tts-speechd_*.deb)"
          module_deb="$(ls dist/speech-dispatcher-silero-tts_*.deb)"
          # Ставим ровно то, что перечислено в Depends: если пакет добавит
          # зависимость, которой здесь нет, dpkg -i ниже упадёт.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-gtk-3.0 python3-numpy \
            gir1.2-ayatanaappindicator3-0.1 rubberband-cli speech-dispatcher

          # Без --force-depends: пакеты обязаны ставиться на чистой системе,
          # все их Depends должны быть доступны в архиве Ubuntu.
          dpkg -i "$common_deb" "$reader_deb" "$speaker_deb" "$module_deb"

          test -x /usr/bin/silero-tts-reader
          bash -n /usr/bin/silero-tts-reader
          test -x /usr/bin/silero-tts-speak
          test -x /usr/bin/silero-tts-speechd
          test -f /etc/speech-dispatcher/modules/silero-tts.conf

          # Зависимости трея и управления скоростью должны быть рабочими
          python3 - <<'PY'
          import gi
          gi.require_version("AyatanaAppIndicator3", "0.1")
          from gi.repository import AyatanaAppIndicator3  # noqa: F401
          print("  ✓ индикатор трея доступен (gir1.2-ayatanaappindicator3-0.1)")
          PY
          command -v rubberband >/dev/null
          echo "  ✓ rubberband-cli на месте: $(rubberband --version 2>&1 | head -1)"

          # Проверка установленного дерева, а не рабочей копии: каталог сменён,
          # иначе sys.path[0] = каталог репозитория и импорт берёт исходники.
          ( cd / && PYTHONPATH=/usr/lib/silero-tts python3 - <<'PY'
          import pathlib
          import silero_tts_reader
          from silero_tts_reader.ui import theme_manager, tray_icon
          from silero_tts_reader.core import tts_engine
          from silero_tts_reader import cli
          print("  ✓ модули импортируются из установленного дерева:", theme_manager.__file__)
          for module in (theme_manager, tts_engine, cli):
              assert module.__file__.startswith("/usr/lib/silero-tts/"), module.__file__
          for path in (
              "/usr/bin/silero-tts-reader",
              "/usr/bin/silero-tts-speak",
              "/usr/bin/silero-tts-speechd",
              "/usr/share/applications/silero-tts-reader.desktop",
              "/usr/share/icons/hicolor/128x128/apps/silero-tts-reader.png",
              "/usr/lib/systemd/user/silero-tts-reader.service",
              "/etc/speech-dispatcher/modules/silero-tts.conf",
          ):
              assert pathlib.Path(path).exists(), path
          print("  ✓ файлы пакетов на своих местах")
          PY
          )

          xvfb-run -a python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk
          ok, _ = Gtk.init_check(None)
          print("  ✓ GTK инициализируется в установленной системе:", ok)
          PY

          # Запускатор обязан внятно сказать про отсутствующие pip-модули
          # (sounddevice и torch в архиве Ubuntu отсутствуют), а не падать трассировкой.
          set +e
          out="$(/usr/bin/silero-tts-reader 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | sed 's/^/    /'
          test "$rc" -eq 1
          printf '%s' "$out" | grep -q "не хватает Python-модулей"
          printf '%s' "$out" | grep -q "sounddevice"
          echo "  ✓ запускатор сообщает об отсутствующих модулях и подсказывает установку"

          # ── speech-dispatcher ────────────────────────────────────────────────
          silero-tts-speechd status >/dev/null 2>&1 && {
            echo "модуль не должен быть включён сразу после установки"; exit 1; }
          silero-tts-speechd enable
          grep -qx 'AddModule "silero-tts" "sd_generic" "silero-tts.conf"' \
            /etc/speech-dispatcher/speechd.conf
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf)" -eq 1
          silero-tts-speechd enable        # повторный запуск ничего не дублирует
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf)" -eq 1
          silero-tts-speechd status
          echo "  ✓ модуль включается идемпотентно"

          # Демон должен разобрать конфиг модуля без ошибок. Звука в контейнере
          # нет, поэтому проверяем именно загрузку модуля по его логу.
          # Каталог логов берём детерминированным: speech-dispatcher уважает
          # XDG_CACHE_HOME, а раннер GitHub его выставляет — тогда лог уходит
          # мимо /root/.cache и проверка падала бы молча.
          rm -rf /root/.cache/speech-dispatcher
          pkill -f 'speech-dispatcher' 2>/dev/null || true
          set +e
          env -u XDG_CACHE_HOME HOME=/root timeout 8 speech-dispatcher -l 4 >/tmp/speechd.out 2>&1
          set -e
          log=/root/.cache/speech-dispatcher/log/speech-dispatcher.log
          if [ ! -f "$log" ] || ! grep -q "Module silero-tts loaded" "$log"; then
            echo "демон не подтвердил загрузку модуля"
            echo "--- stdout демона ---"; sed 's/^/    /' /tmp/speechd.out
            echo "--- найденные логи ---"; find /root/.cache "$XDG_CACHE_HOME" -name '*.log' 2>/dev/null | sed 's/^/    /'
            exit 1
          fi
          if grep -qiE "unknown config-option|can't open|failed to read" \
              /root/.cache/speech-dispatcher/log/silero-tts.log 2>/dev/null; then
            echo "ошибки разбора конфига модуля:"
            cat /root/.cache/speech-dispatcher/log/silero-tts.log; exit 1
          fi
          grep -i silero "$log" | sed 's/^/    /'
          echo "  ✓ speech-dispatcher загружает модуль silero-tts"

          silero-tts-speechd disable
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf || true)" -eq 0
          echo "  ✓ модуль отключается без следов в speechd.conf"

          # CLI обязан объяснить отсутствие torch, а не падать трассировкой
          set +e
          out="$(silero-tts-speak "проверка" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | sed 's/^/    /'
          test "$rc" -eq 1
          printf '%s' "$out" | grep -q "torch"

          # Удаляем в обратном порядке зависимостей. Байткод выше создали мы сами
          # (импорт из установленного дерева), он не принадлежит пакетам — без
          # чистки dpkg не сможет убрать общие каталоги.
          find /usr/lib/silero-tts -name '__pycache__' -type d -prune -exec rm -rf {} +
          dpkg -r speech-dispatcher-silero-tts silero-tts-speechd silero-tts-reader silero-tts-common
          test ! -e /usr/bin/silero-tts-reader
          test ! -e /usr/bin/silero-tts-speak
          test ! -e /usr/bin/silero-tts-speechd
          test ! -e /usr/lib/silero-tts/silero_tts_reader
          echo "  ✓ все четыре пакета удаляются"

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: silero-tts-reader-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach .deb to the release
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')   # любой тег, не только v*
    runs-on: ubuntu-26.04
    steps:
      # gh release create --generate-notes требует git-историю: без checkout
      # он падает «fatal: not a git repository».
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: silero-tts-reader-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.deb --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
