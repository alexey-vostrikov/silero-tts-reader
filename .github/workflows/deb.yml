name: deb

on:
  push:            # любая ветка и теги v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# GH Actions на Linux и так запускает шаги в bash; в act по умолчанию sh,
# а в шагах используется pipefail — поэтому оболочка задаётся явно.
defaults:
  run:
    shell: bash

jobs:
  deb:
    name: build .deb
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      # git ставится ДО checkout: иначе actions/checkout не находит git и качает
      # архив через REST API — без .git, то есть без коммита и тегов для версии пакета.
      - name: Install git
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git

      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # вся история: нужна для git describe
          fetch-tags: true   # и теги — из них складывается версия пакета

      - name: Build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3 python3-pil gettext   # msgfmt: без него не собрать переводы

            # Каталог переводов — артефакт сборки: в git его нет, а checkout
            # вычищает неотслеживаемое. Собираем заранее, иначе и тесты, и
            # пакет остались бы без локализации.
            python3 packaging/i18n-wrap.py
            python3 packaging/i18n-build.py

      - name: Check git metadata
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version
          sha="$(git rev-parse --short HEAD)"   # без .git здесь будет ошибка — и это сигнал
          echo "HEAD:     $sha"
          echo "describe: $(git describe --tags --always 2>&1 || true)"
          echo "tags:     $(git tag --list | tr '\n' ' ')"

      - name: Lint and style
        run: |
          # Линтер проверяет то, что не видит ни один тест: неопределённые имена,
          # перекрытые переменные, мёртвый код. Именно он нашёл `len(segment)` в
          # воркере и перекрытие имени `_` в rate.py.
          #
          # Версия закреплена: правила меняются между выпусками, и «зелено
          # вчера» не значит «зелено сегодня».
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pipx
          pipx run ruff==0.17.3 check . --output-format=github

      - name: Headless GTK tests
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-glib-2.0 python3-numpy python3-xlib \
            libgtk4-layer-shell0 xvfb rubberband-cli dbus-daemon
          xvfb-run -a python3 tests/smoke_gtk.py

      - name: Unit tests
        run: |
          # Регрессия: pynput-ветка роняла приложение на старте (dict как ключ
          # словаря). В образе pynput нет — тест подставляет пустышку и
          # отдельным прогоном проверяет систему совсем без pynput.
          python3 tests/test_hotkeys.py
          python3 tests/run_hotkeys_without_pynput.py
          # Языки: выбор модели, профили, числительные, миграция конфига.
          # Модели подменяются заглушками — 139 МБ в CI не качаются. Второй
          # прогон скрывает torch: в образе его нет, и порядок проверок не
          # должен от этого зависеть.
          python3 tests/test_multilang.py
          python3 tests/run_multilang_without_torch.py
          # Скорость: растяжение через rubberband-cli и шкала speech-dispatcher.
          # rubberband-cli поставлен выше, поэтому проверяется настоящая работа.
          python3 tests/test_rate.py
          # Языки интерфейса: en_US через каталог gettext, ru_RU — исходный текст
          python3 tests/test_i18n.py
          # Один экземпляр: замена устаревшей сборки, действия и открытие файлов
          python3 tests/test_instance.py
          # Действия приложения требуют GTK: в CI дисплея нет, поэтому Xvfb
          xvfb-run -a python3 tests/test_app_actions.py
          # Книги FB2: все контейнеры, кодировки, LZ4, ошибки
          python3 tests/test_fb2.py
          # Потоковая подача: границы глав, обратное давление, остановка
          python3 tests/test_streaming.py
          # Проигрывание: один поток вывода, пауза между фразами, общий прогресс
          xvfb-run -a python3 tests/test_playback.py
          # Позиционирование окна: решения при отсутствии протокола и монитор по номеру
          python3 tests/test_layer_shell.py
          # Значок в лотке: регистрация, свойства, раскладка меню, нажатия.
          # Служба лотка подменена заглушкой на отдельной шине.
          dbus-run-session -- python3 tests/test_sni_tray.py
          # Значок лотка: вариант штриха под панель и состояние воспроизведения
          python3 tests/test_tray_icons.py
          # Значок окна: согласие app-id с .desktop и установка иконки
          xvfb-run -a python3 tests/test_window_icon.py
          # Локализация: каталог свежий, все строки переведены, ни одна не забыта
          python3 packaging/i18n-build.py
          python3 packaging/i18n-audit.py
          # Те же тесты в английской локали: тексты не должны зависеть от LANG
          LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 python3 tests/test_fb2.py
          LANGUAGE=en_US.UTF-8 LANG=en_US.UTF-8 xvfb-run -a python3 tests/test_app_actions.py

      - name: Build packages
        id: build
        run: |
          set -euo pipefail
          ./packaging/build-deb.sh | tee build.log
          mapfile -t debs < <(ls dist/*.deb)
          test "${#debs[@]}" -eq 4
          version="$(dpkg-deb -f "${debs[0]}" Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### собрано 4 пакета, версия \`$version\`"
            echo
            for deb in "${debs[@]}"; do
              echo "- \`$(basename "$deb")\` ($(du -h "$deb" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb" | sed -n '1,12p' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Inspect package contents
        run: |
          set -euo pipefail
          check() {   # пакет, затем список обязательных путей построчно
            local deb="$1"; shift
            local listing; listing="$(mktemp)"
            dpkg-deb --contents "$deb" > "$listing"
            echo "── $(basename "$deb")"
            sed 's/^/  /' "$listing"
            local missing=0
            # Сравнение по последнему полю строки листинга: путь не должен быть
            # подстрокой другого (…silero-tts и …silero-tts.desktop).
            # Пайплайн с «grep -q» здесь не годится: он закрывает поток раньше,
            # dpkg-deb получает SIGPIPE, и с pipefail шаг ложно падает.
            for path in "$@"; do
              if awk -v p="$path" '$NF == p { found = 1 } END { exit(found ? 0 : 1) }' "$listing"; then
                echo "  ✓ $path"
              else
                echo "  ✗ нет в пакете: $path"
                missing=$((missing + 1))
              fi
            done
            # байткод и кеши в пакет попадать не должны
            if grep -qE '__pycache__|\.pyc' "$listing"; then
              echo "  ✗ в пакете есть __pycache__/.pyc"
              missing=$((missing + 1))
            fi
            rm -f "$listing"
            test "$missing" -eq 0
          }

          check dist/silero-tts-common_*.deb \
            ./usr/bin/silero-tts-model \
            ./usr/lib/silero-tts/silero_tts_reader/__init__.py \
            ./usr/lib/silero-tts/silero_tts_reader/models.py \
            ./usr/lib/silero-tts/silero_tts_reader/config/config_manager.py \
            ./usr/lib/silero-tts/silero_tts_reader/core/tts_engine.py \
            ./usr/lib/silero-tts/silero_tts_reader/core/rate.py \
            ./usr/lib/silero-tts/silero_tts_reader/i18n.py \
            ./usr/lib/silero-tts/silero_tts_reader/build_info.py \
            ./usr/lib/silero-tts/silero_tts_reader/instance.py \
            ./usr/lib/silero-tts/silero_tts_reader/core/fb2.py \
            ./usr/lib/silero-tts/build-info.json \
            ./usr/share/locale/en_US/LC_MESSAGES/silero-tts-reader.mo \
            ./usr/share/doc/silero-tts-common/copyright
          check dist/silero-tts-reader_*.deb \
            ./usr/bin/silero-tts-reader \
            ./usr/share/applications/ru.skala.silero-tts-reader.desktop \
            ./usr/share/icons/hicolor/256x256/apps/silero-tts-reader.png \
            ./usr/share/pixmaps/silero-tts-reader.png \
            ./usr/lib/silero-tts/run.py \
            ./usr/lib/silero-tts/silero_tts_reader/app.py \
            ./usr/lib/silero-tts/silero_tts_reader/ui/playback_widget.py \
            ./usr/lib/silero-tts/silero_tts_reader/ui/layer_shell.py \
            ./usr/lib/silero-tts/silero_tts_reader/ui/sni_tray.py \
            ./usr/lib/silero-tts/silero_tts_reader/ui/window_icon.py \
            ./usr/lib/systemd/user/silero-tts-reader.service
          check dist/silero-tts-speechd_*.deb \
            ./usr/bin/silero-tts-speak \
            ./usr/bin/silero-tts-speechd \
            ./usr/lib/silero-tts/silero_tts_reader/cli.py
          check dist/speech-dispatcher-silero-tts_*.deb \
            ./etc/speech-dispatcher/modules/silero-tts.conf \
            ./usr/share/doc/speech-dispatcher-silero-tts/copyright
          # общий код не должен повторяться в двух пакетах
          if for deb in dist/*.deb; do dpkg-deb --contents "$deb" | awk '$NF ~ /^\.\// {print $NF}'; done \
              | grep -v '/$' | sort | uniq -d | tee /dev/stderr | grep -q .; then
            echo "✗ файл попал в два пакета"; exit 1
          fi
          echo "  ✓ файлы пакетов не пересекаются"

      - name: Install into a clean system
        run: |
          set -euo pipefail
          common_deb="$(ls dist/silero-tts-common_*.deb)"
          reader_deb="$(ls dist/silero-tts-reader_*.deb)"
          speaker_deb="$(ls dist/silero-tts-speechd_*.deb)"
          module_deb="$(ls dist/speech-dispatcher-silero-tts_*.deb)"
          # Ставим ровно то, что перечислено в Depends: если пакет добавит
          # зависимость, которой здесь нет, dpkg -i ниже упадёт.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-gi gir1.2-glib-2.0 gir1.2-gtk-4.0 python3-numpy python3-scipy \
            python3-xlib libgtk4-layer-shell0 rubberband-cli speech-dispatcher

          # Без --force-depends: пакеты обязаны ставиться на чистой системе,
          # все их Depends должны быть доступны в архиве Ubuntu.
          dpkg -i "$common_deb" "$reader_deb" "$speaker_deb" "$module_deb"

          test -x /usr/bin/silero-tts-reader
          bash -n /usr/bin/silero-tts-reader
          test -x /usr/bin/silero-tts-speak
          test -x /usr/bin/silero-tts-speechd
          test -f /etc/speech-dispatcher/modules/silero-tts.conf

          # Зависимости трея и управления скоростью должны быть рабочими.
          # Значок отдаётся по D-Bus (StatusNotifierItem), поэтому проверяем
          # модуль значка и запасной путь для X11, а не привязку AppIndicator.
          # PYTHONPATH обязателен: пакет лежит в /usr/lib/silero-tts, и без него
          # импорт ищет модули в текущем каталоге и падает.
          PYTHONPATH=/usr/lib/silero-tts python3 - <<'PY'
          import gi
          gi.require_version("Gio", "2.0")
          from gi.repository import Gio  # noqa: F401
          from silero_tts_reader.ui import layer_shell, sni_tray
          print("  ✓ значок трея: StatusNotifierItem по D-Bus")
          print(f"  ✓ layer-shell: {layer_shell.reason()}")
          PY
          python3 -c "from Xlib import display; print('  ✓ python-xlib для X11 на месте')"
          command -v rubberband >/dev/null
          echo "  ✓ rubberband-cli на месте: $(rubberband --version 2>&1 | head -1)"

          # Проверка установленного дерева, а не рабочей копии: каталог сменён,
          # иначе sys.path[0] = каталог репозитория и импорт берёт исходники.
          ( cd / && PYTHONPATH=/usr/lib/silero-tts python3 - <<'PY'
          import pathlib
          import silero_tts_reader
          from silero_tts_reader.ui import layer_shell, sni_tray, theme_manager, window_icon
          from silero_tts_reader.core import tts_engine
          from silero_tts_reader import cli
          print("  ✓ модули импортируются из установленного дерева:", theme_manager.__file__)
          for module in (theme_manager, tts_engine, cli):
              assert module.__file__.startswith("/usr/lib/silero-tts/"), module.__file__
          for path in (
              "/usr/bin/silero-tts-reader",
              "/usr/bin/silero-tts-speak",
              "/usr/bin/silero-tts-speechd",
              "/usr/share/applications/ru.skala.silero-tts-reader.desktop",
              "/usr/share/icons/hicolor/128x128/apps/silero-tts-reader.png",
              "/usr/lib/systemd/user/silero-tts-reader.service",
              "/etc/speech-dispatcher/modules/silero-tts.conf",
          ):
              assert pathlib.Path(path).exists(), path
          print("  ✓ файлы пакетов на своих местах")
          PY
          )

          xvfb-run -a python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          from gi.repository import Gtk
          ok = Gtk.init_check()
          print("  ✓ GTK4 инициализируется в установленной системе:", ok)
          assert ok
          PY

          # Запускатор обязан внятно сказать про отсутствующие pip-модули
          # (sounddevice и torch в архиве Ubuntu отсутствуют), а не падать трассировкой.
          set +e
          out="$(/usr/bin/silero-tts-reader 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | sed 's/^/    /'
          test "$rc" -eq 1
          printf '%s' "$out" | grep -q "не хватает Python-модулей"
          printf '%s' "$out" | grep -q "sounddevice"
          echo "  ✓ запускатор сообщает об отсутствующих модулях и подсказывает установку"

          # Переводы: каталог на месте и применяется.
          #
          # Некоторые образы (в том числе образ act) содержат
          # path-exclude=/usr/share/locale/*/LC_MESSAGES/*.mo: dpkg тогда честно
          # ставит пакет, но файл перевода не распаковывает. Это свойство
          # образа, а не пакета, поэтому проверку пропускаем с явным сообщением,
          # а на настоящем раннере проверяем по-настоящему.
          mo=/usr/share/locale/en_US/LC_MESSAGES/silero-tts-reader.mo
          test -f "$mo" || dpkg -L silero-tts-common | grep -qx "$mo" \
            || { echo "пакет не содержит перевода"; exit 1; }
          if grep -rqs "path-exclude=/usr/share/locale" /etc/dpkg/dpkg.cfg.d/; then
            echo "  ⚠ образ исключает распаковку .mo (dpkg path-exclude) — проверка в системе пропущена"
          else
            test -f "$mo" || { echo "перевод не установился: $mo"; exit 1; }
            ( cd / && PYTHONPATH=/usr/lib/silero-tts python3 - <<'PY'
          from silero_tts_reader import i18n
          i18n.init("en_US")
          assert i18n._("Текст не выделен") == "No text selected", i18n._("Текст не выделен")
          i18n.init("ru_RU")
          assert i18n._("Текст не выделен") == "Текст не выделен"
          print("  ✓ переводы en_US и ru_RU работают в установленной системе")
          PY
            )
          fi

          # Загрузчик моделей: каталог должен читаться без torch и без сети
          silero-tts-model list | tee /tmp/models.txt
          grep -q "v5_ru.pt" /tmp/models.txt
          grep -q "v3_en.pt" /tmp/models.txt
          echo "  ✓ silero-tts-model перечисляет модели"

          # ── speech-dispatcher ────────────────────────────────────────────────
          silero-tts-speechd status >/dev/null 2>&1 && {
            echo "модуль не должен быть включён сразу после установки"; exit 1; }
          silero-tts-speechd enable
          grep -qx 'AddModule "silero-tts" "sd_generic" "silero-tts.conf"' \
            /etc/speech-dispatcher/speechd.conf
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf)" -eq 1
          silero-tts-speechd enable        # повторный запуск ничего не дублирует
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf)" -eq 1
          silero-tts-speechd status
          echo "  ✓ модуль включается идемпотентно"

          # Демон должен разобрать конфиг модуля без ошибок. Звука в контейнере
          # нет, поэтому проверяем именно загрузку модуля по его логу.
          # Каталог логов берём детерминированным: speech-dispatcher уважает
          # XDG_CACHE_HOME, а раннер GitHub его выставляет — тогда лог уходит
          # мимо /root/.cache и проверка падала бы молча.
          rm -rf /root/.cache/speech-dispatcher
          pkill -f 'speech-dispatcher' 2>/dev/null || true
          set +e
          env -u XDG_CACHE_HOME HOME=/root timeout 8 speech-dispatcher -l 4 >/tmp/speechd.out 2>&1
          set -e
          log=/root/.cache/speech-dispatcher/log/speech-dispatcher.log
          if [ ! -f "$log" ] || ! grep -q "Module silero-tts loaded" "$log"; then
            echo "демон не подтвердил загрузку модуля"
            echo "--- stdout демона ---"; sed 's/^/    /' /tmp/speechd.out
            echo "--- найденные логи ---"; find /root/.cache "$XDG_CACHE_HOME" -name '*.log' 2>/dev/null | sed 's/^/    /'
            exit 1
          fi
          if grep -qiE "unknown config-option|can't open|failed to read" \
              /root/.cache/speech-dispatcher/log/silero-tts.log 2>/dev/null; then
            echo "ошибки разбора конфига модуля:"
            cat /root/.cache/speech-dispatcher/log/silero-tts.log; exit 1
          fi
          grep -i silero "$log" | sed 's/^/    /'
          echo "  ✓ speech-dispatcher загружает модуль silero-tts"

          silero-tts-speechd disable
          test "$(grep -c 'AddModule "silero-tts"' /etc/speech-dispatcher/speechd.conf || true)" -eq 0
          echo "  ✓ модуль отключается без следов в speechd.conf"

          # CLI обязан объяснить отсутствие torch, а не падать трассировкой
          set +e
          out="$(silero-tts-speak "проверка" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out" | sed 's/^/    /'
          test "$rc" -eq 1
          printf '%s' "$out" | grep -q "torch"

          # Удаляем в обратном порядке зависимостей. Байткод выше создали мы сами
          # (импорт из установленного дерева), он не принадлежит пакетам — без
          # чистки dpkg не сможет убрать общие каталоги.
          find /usr/lib/silero-tts -name '__pycache__' -type d -prune -exec rm -rf {} +
          dpkg -r speech-dispatcher-silero-tts silero-tts-speechd silero-tts-reader silero-tts-common
          test ! -e /usr/bin/silero-tts-reader
          test ! -e /usr/bin/silero-tts-speak
          test ! -e /usr/bin/silero-tts-speechd
          test ! -e /usr/lib/silero-tts/silero_tts_reader
          echo "  ✓ все четыре пакета удаляются"

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: silero-tts-reader-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach .deb to the release
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')   # любой тег, не только v*
    runs-on: ubuntu-26.04
    steps:
      # gh release create --generate-notes требует git-историю: без checkout
      # он падает «fatal: not a git repository».
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: silero-tts-reader-deb
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.deb --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
