name: apt repo

# Публикует deb-пакеты в apt-репозиторий на GitHub Pages.
#
# Раскладка: ветка gh-pages, каталог repo/. Установка:
#   deb [signed-by=/usr/share/keyrings/silero-tts.gpg] \
#       https://alexey-vostrikov.github.io/silero-tts-reader/repo stable main
#
# Почему отдельная ветка на каждый тег. reprepro (движок
# smeinecke/apt-repo-action) в одной ветке (`suite`) держит только последнюю
# версию пакета: проверил — из пяти загруженных остаётся одна, а старые файлы
# он удаляет как более не нужные. Поэтому «пять последних тегов» = пять suite,
# по одному на тег, плюс `stable` с содержимым самого свежего тега.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  matrix:
    name: какие теги публиковать
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.tags.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tags
        name: пять последних тегов
        run: |
          set -euo pipefail
          # Сортировка по версии, а не по дате: тег может появиться позже, но
          # быть старее по номеру.
          mapfile -t tags < <(git tag --sort=-v:refname | head -5)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "нет ни одного тега — публиковать нечего" >&2
            exit 1
          fi
          newest="${tags[0]}"
          # stable первым: он должен существовать до того, как в него что-то
          # положат, а содержимое берётся из самого свежего тега.
          include="[{\"tag\":\"${newest}\",\"codename\":\"stable\"}"
          for tag in "${tags[@]}"; do
            include+=",{\"tag\":\"${tag}\",\"codename\":\"${tag}\"}"
          done
          include+="]"
          echo "include=${include}" >> "$GITHUB_OUTPUT"
          printf '  %s\n' "${tags[@]}"

  publish:
    name: ${{ matrix.codename }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      # Ветка gh-pages одна на всех: параллельные job'ы затрут друг друга.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Скачать deb из релиза ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Комплект полный: четыре пакета на каждый тег. Неполный релиз —
          # ошибка, а не повод собрать репозиторий наполовину.
          gh release download "${{ matrix.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*_all.deb' \
            --dir "debs/${{ matrix.tag }}"
          count="$(ls -1 debs/${{ matrix.tag }}/*.deb | wc -l)"
          echo "скачано файлов: $count"
          if [ "$count" -ne 4 ]; then
            echo "ожидалось 4 пакета, получено $count" >&2
            ls -la "debs/${{ matrix.tag }}" >&2
            exit 1
          fi

      - name: Положить в репозиторий (${{ matrix.codename }})
        uses: smeinecke/apt-repo-action@v2.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_arch: |
            amd64
          repo_supported_version: |
            ${{ matrix.codename }}
          file: debs/${{ matrix.tag }}/*_all.deb
          file_target_version: ${{ matrix.codename }}
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ secrets.APT_SIGNING_PUBKEY }}
          # Повторный прогон по тому же тегу — не ошибка.
          skip_duplicates: true
