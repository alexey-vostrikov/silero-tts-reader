name: apt repo

# Публикует deb-пакеты пяти последних тегов в apt-репозиторий на GitHub Pages.
#
# Действие своё (.github/actions/apt-repo) и работает на aptly: reprepro,
# на котором стоит готовая smeinecke/apt-repo-action, в одной ветке держит
# только последнюю версию пакета и удаляет файлы старых. aptly держит все
# версии, поэтому пять тегов живут в одной ветке stable и ставятся выбором
# версии (apt install silero-tts-reader=0.3.0+gtk).
#
# Установка:
#   deb [signed-by=/usr/share/keyrings/silero-tts.gpg] \
#       https://alexey-vostrikov.github.io/silero-tts-reader/repo stable main

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  publish:
    name: собрать репозиторий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Пять последних тегов
        id: tags
        run: |
          set -euo pipefail
          # По версии, а не по дате: тег может появиться позже, будучи старее
          # по номеру версии.
          mapfile -t tags < <(git tag --sort=-v:refname | head -5)
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "нет ни одного тега — публиковать нечего" >&2
            exit 1
          fi
          printf '  %s\n' "${tags[@]}"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"

      - name: Скачать deb из этих релизов
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          total=0
          for tag in $TAGS; do
            mkdir -p "debs/$tag"
            # Комплект полный: четыре пакета на тег. Неполный релиз — ошибка,
            # а не повод опубликовать половину.
            gh release download "$tag" \
              --repo "${{ github.repository }}" \
              --pattern '*_all.deb' \
              --dir "debs/$tag"
            count="$(ls -1 "debs/$tag"/*.deb 2>/dev/null | wc -l)"
            echo "  $tag: $count пакетов"
            if [ "$count" -ne 4 ]; then
              echo "в релизе $tag ожидалось 4 пакета, получено $count" >&2
              exit 1
            fi
            total=$((total + count))
          done
          echo "всего файлов: $total"

      - name: Опубликовать
        uses: alexey-vostrikov/apt-repo-action@v1
        with:
          files: debs/*/*.deb
          signing_key: ${{ secrets.APT_SIGNING_KEY }}
          signing_passphrase: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          keep_versions: 5
          distribution: stable
          component: main
          architectures: amd64
          github_token: ${{ secrets.GITHUB_TOKEN }}
