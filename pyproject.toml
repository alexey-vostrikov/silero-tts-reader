[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silero-tts-reader"
version = "2.0.0"
description = "Text-to-speech reader using Silero TTS with global hotkeys and system tray (GTK4 / PyGObject)"
readme = "README.md"
requires-python = ">=3.10"
# PyGObject (gi) НЕ в pip-зависимостях: он требует системных заголовков GTK и
# ставится пакетом дистрибутива (python3-gi, gir1.2-gtk-4.0). Проверка при запуске:
#   python3 -c "import gi; gi.require_version('Gtk','4.0')"
dependencies = [
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyperclip>=1.8.2",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
speed = ["pyrubberband>=0.3.0"]

[project.scripts]
silero-tts-reader = "silero_tts_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silero_tts_reader*"]

[tool.setuptools.package-data]
silero_tts_reader = ["assets/*"]

[tool.ruff]
# Минимальная версия — как в requires-python: правила вида UP под неё и
# подбираются, иначе линтер предложит синтаксис, которого на 3.10 нет.
target-version = "py310"
line-length = 100
src = ["silero_tts_reader", "tests", "packaging"]

[tool.ruff.lint]
# Набор выбран по тому, что реально ловит ошибки в этом коде:
# E/F — синтаксис и имена (именно они нашли `len(segment)` и перекрытие `_`),
# I — порядок импортов, UP — устаревший синтаксис, B — типичные ловушки
# (изменяемый аргумент, слепой except), SIM — лишние конструкции,
# RUF — правила самого ruff, C4 — лишние обёртки над генераторами.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE"]
# BLE001 (слепой except) в этом приложении осознан: фоновый поток синтеза и
# работа с чужими библиотеками через ctypes не должны ронять всё приложение
# из-за одного сбоя. Такие места помечены комментарием с причиной.
# RUF001/002/003 ищут «неоднозначные» буквы в строках, докстрингах и
# комментариях: кириллические «с», «о», «у» похожи на латинские. В проекте весь
# текст русский, и эти три правила дают 700+ замечаний на осмысленный текст —
# отключаем их целиком, а не по одной строке.
ignore = ["BLE001", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тесты печатают ход проверки и держат длинные сообщения об ошибках — это их
# форма вывода, а не код приложения.
# E402: тесты сначала правят sys.path, потом импортируют пакет — иначе
# импорт не найдёт исходники из дерева.
"tests/*" = ["T201", "E501", "E402"]
# Скрипты сборки и локализации живут отдельно от пакета: у них свои приёмы
# (печать в stderr, длинные шаблоны CSS).
"packaging/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["silero_tts_reader"]
