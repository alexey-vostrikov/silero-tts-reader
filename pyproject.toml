[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silero-tts-reader"
version = "2.0.0"
description = "Text-to-speech reader using Silero TTS with global hotkeys and system tray (GTK3 / PyGObject)"
readme = "README.md"
requires-python = ">=3.10"
# PyGObject (gi) НЕ в pip-зависимостях: он требует системных заголовков GTK и
# ставится пакетом дистрибутива (python3-gi, gir1.2-gtk-3.0). Проверка при запуске:
#   python3 -c "import gi; gi.require_version('Gtk','3.0')"
dependencies = [
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pyperclip>=1.8.2",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
speed = ["pyrubberband>=0.3.0"]

[project.scripts]
silero-tts-reader = "silero_tts_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silero_tts_reader*"]

[tool.setuptools.package-data]
silero_tts_reader = ["assets/*"]
