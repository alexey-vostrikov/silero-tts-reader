# Конфигурация output-модуля speech-dispatcher для Silero TTS.
#
# Модуль не требует собственного бинарника: используется штатный generic-плагин
# speech-dispatcher (sd_generic), а синтез и воспроизведение делает
# /usr/bin/silero-tts-speak из пакета silero-tts-speechd.
#
# Подключается одной строкой в /etc/speech-dispatcher/speechd.conf (в разделе
# OUTPUT MODULES CONFIGURATION):
#
#     AddModule "silero-tts" "sd_generic" "silero-tts.conf"
#
# Это делает команда `sudo silero-tts-speechd enable` (обратная — `disable`).
#
# Темп ($RATE) и высота ($PITCH) в команду не передаются: модели Silero их не
# поддерживают, а подстановка целочисленного темпа speech-dispatcher превратила
# бы нормальную скорость в мусор. Менять темп можно в самом приложении.

# $LANGUAGE подставляет клиент: ru для русского, en для английского. CLI по
# этому коду выбирает модель, а при пустом значении определяет язык по тексту.
# --mixed переключает язык внутри фразы по письменности: латинское слово
# читается английской моделью, кириллица — русской, поэтому «synthesize
# использует пути движка» звучит двумя голосами.
# $RATE — темп в шкале speech-dispatcher (-100…+100). CLI переводит его в
# множитель (0.5…2.0) и растягивает звук через rubberband-cli, не меняя тон.
# $PITCH не передаётся: модели Silero не умеют менять высоту тона.
GenericExecuteSynth "/usr/bin/silero-tts-speak --mixed --lang '$LANGUAGE' --spd-rate '$RATE' --voice '$VOICE' '$DATA'"
GenericCmdDependency "/usr/bin/silero-tts-speak"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Соответствие языков speech-dispatcher и моделей Silero.
GenericLanguage "ru" "ru"
GenericLanguage "en" "en"

# Режимы пунктуации: значение подставляется в $PUNCT. Модели Silero не умеют
# управлять пунктуацией, поэтому все режимы пустые, но объявлены явно — иначе
# sd_generic считает режим неопределённым.
GenericPunctNone ""
GenericPunctSome ""
GenericPunctMost ""
GenericPunctAll ""

# Русские голоса: модель v5_ru.pt. Слева — символические имена speech-dispatcher
# (их понимают клиенты вроде spd-say -y), справа — голоса модели.
AddVoice    "ru"    "FEMALE1"    "xenia"
AddVoice    "ru"    "FEMALE2"    "baya"
AddVoice    "ru"    "FEMALE3"    "kseniya"
AddVoice    "ru"    "MALE1"      "aidar"
AddVoice    "ru"    "MALE2"      "eugene"
AddVoice    "ru"    "MALE3"      "random"

# Английские голоса: модель v3_en.pt, у неё 118 голосов en_0…en_117 и random.
# Объявлены по типам, чтобы работал выбор через -t female1/male1 и по имени
# (-y en_0). Необъявленное имя speech-dispatcher заменяет голосом по умолчанию,
# поэтому остальные голоса доступны через CLI: silero-tts-speak --voice en_42,
# и их можно объявить здесь же строкой AddVoice (файл — conffile).
# Модель не входит в пакет: silero-tts-model download en (55 МБ).
AddVoice    "en"    "FEMALE1"    "en_0"
AddVoice    "en"    "FEMALE2"    "en_2"
AddVoice    "en"    "FEMALE3"    "en_4"
AddVoice    "en"    "MALE1"      "en_1"
AddVoice    "en"    "MALE2"      "en_3"
AddVoice    "en"    "MALE3"      "en_117"

# Голос по умолчанию, если клиент не указал ни тип, ни имя. На практике
# speech-dispatcher присылает тип MALE1, поэтому без -t/-y звучит aidar
# (для английского — en_1).
DefaultVoice "xenia"
