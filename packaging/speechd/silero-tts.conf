# Конфигурация output-модуля speech-dispatcher для Silero TTS.
#
# Модуль не требует собственного бинарника: используется штатный generic-плагин
# speech-dispatcher (sd_generic), а синтез и воспроизведение делает
# /usr/bin/silero-tts-speak из пакета silero-tts-reader.
#
# Подключается одной строкой в /etc/speech-dispatcher/speechd.conf (в разделе
# OUTPUT MODULES CONFIGURATION):
#
#     AddModule "silero-tts" "sd_generic" "silero-tts.conf"
#
# Это делает команда `sudo silero-tts-speechd enable` (обратная — `disable`).
#
# Темп ($RATE) и высота ($PITCH) в команду не передаются: модель Silero v5 их не
# поддерживает, а подстановка целочисленного темпа speech-dispatcher превратила бы
# нормальную скорость в мусор. Менять темп можно в самом приложении.

GenericExecuteSynth "/usr/bin/silero-tts-speak --voice '$VOICE' '$DATA'"
GenericCmdDependency "/usr/bin/silero-tts-speak"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Соответствие языков speech-dispatcher и модели.
GenericLanguage "ru" "ru"
GenericLanguage "en" "en"

# Режимы пунктуации: значение подставляется в $PUNCT. Модель Silero v5 не умеет
# управлять пунктуацией, поэтому все режимы пустые, но объявлены явно — иначе
# sd_generic считает режим неопределённым.
GenericPunctNone ""
GenericPunctSome ""
GenericPunctMost ""
GenericPunctAll ""

# Голоса Silero v5. Слева — символические имена speech-dispatcher
# (их же понимают клиенты вроде spd-say -y), справа — голоса модели.
AddVoice    "ru"    "FEMALE1"    "xenia"
AddVoice    "ru"    "FEMALE2"    "baya"
AddVoice    "ru"    "FEMALE3"    "kseniya"
AddVoice    "ru"    "MALE1"      "aidar"
AddVoice    "ru"    "MALE2"      "eugene"
AddVoice    "ru"    "MALE3"      "random"
AddVoice    "en"    "FEMALE1"    "xenia"
AddVoice    "en"    "MALE1"      "aidar"

DefaultVoice "xenia"
